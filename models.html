    let currentCategory = "Semua";

    function setupTabs() {
      const categories = ["Semua", ...new Set(MODELS.map(m => m.cat))];
      document.getElementById("categoryTabs").innerHTML = categories.map(c => `
        <button onclick="setCategory('${c}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${currentCategory === c ? 'bg-black text-white' : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'}">
          ${c}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      currentCategory = cat;
      setupTabs();
      render();
    }

    function render() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = MODELS.filter(m => {
        const matchCat = currentCategory === "Semua" || m.cat === currentCategory;
        const matchQ = m.name.toLowerCase().includes(q) || m.fefco.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      document.getElementById("modelsGrid").innerHTML = filtered.map(m => `
        <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="h-48 bg-gray-100 flex items-center justify-center p-4 overflow-hidden relative">
              <img src="${m.thumb}" alt="${m.name}" class="max-h-full max-w-full object-contain hover:scale-105 transition duration-300" />
              <span class="absolute top-3 left-3 text-xs font-mono font-bold bg-white/90 backdrop-blur px-2.5 py-1 rounded shadow-sm text-blue-600">${m.fefco}</span>
              <span class="absolute top-3 right-3 badge bg-black/80 text-white backdrop-blur">${m.badge}</span>
            </div>
            <div class="p-5">
              <h3 class="text-lg font-bold text-gray-900">${m.name}</h3>
              <p class="text-xs text-gray-500 mb-2">${m.cat}</p>
              <p class="text-sm text-gray-600 line-clamp-2 mb-4">${m.desc}</p>
              <div class="text-xs text-gray-500 bg-gray-50 p-2.5 rounded-lg space-y-1">
                <div><strong>Default:</strong> ${m.dims.length} × ${m.dims.width} × ${m.dims.height} mm</div>
                <div><strong>Bahan:</strong> ${m.dims.board} (${m.dims.thickness} mm)</div>
              </div>
            </div>
          </div>
          <div class="p-5 pt-0 flex gap-2">
            <button onclick="openModal('${m.id}')" class="flex-1 py-2 text-xs font-semibold bg-gray-100 text-gray-800 rounded-lg hover:bg-gray-200 transition">Detail Spek CAD</button>
            <a href="/studio" class="py-2 px-3 text-xs font-semibold bg-black text-white rounded-lg hover:bg-gray-800 transition">Buka di Studio &rarr;</a>
          </div>
        </div>
      `).join("");
    }

    function openModal(id) {
      const m = MODELS.find(x => x.id === id);
      if (!m) return;
      document.getElementById("modalContent").innerHTML = `
        <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-black text-xl font-bold">&times;</button>
        <div class="flex items-center gap-2 mb-1">
          <span class="font-mono text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${m.fefco}</span>
          <span class="badge bg-gray-100 text-gray-800">${m.badge}</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">${m.name}</h2>
        <p class="text-sm text-gray-600 mb-6">${m.desc}</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="p-4 bg-gray-50 rounded-xl border border-gray-100">
            <h4 class="font-bold text-xs uppercase text-gray-500 mb-2">Preset Ukuran Industri</h4>
            <ul class="text-xs space-y-1.5 text-gray-700">
              ${m.presets.map(p => `<li>&bull; <strong>${p.label}:</strong> ${p.p} × ${p.l} × ${p.t} mm</li>`).join("")}
            </ul>
          </div>
          <div class="p-4 bg-gray-50 rounded-xl border border-gray-100">
            <h4 class="font-bold text-xs uppercase text-gray-500 mb-2">Bahan &amp; Caliper Board</h4>
            <ul class="text-xs space-y-1 text-gray-700">
              ${m.boards.map(b => `<li>&bull; ${b}</li>`).join("")}
            </ul>
          </div>
        </div>

        <div class="p-4 bg-blue-50/50 rounded-xl border border-blue-100 mb-6 text-xs text-gray-700 space-y-1">
          <div class="font-bold text-blue-900 mb-1">Desain Default Template:</div>
          <div><strong>Brand:</strong> ${m.design.brand} — ${m.design.sub}</div>
          <div><strong>Warna:</strong> ${m.design.base} &bull; <strong>Finish:</strong> ${m.design.finish}</div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-200">
          <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-xs font-semibold hover:bg-gray-50">Tutup</button>
          <a href="/studio" class="px-4 py-2 bg-black text-white rounded-lg text-xs font-semibold hover:bg-gray-800">Edit Model di Studio &rarr;</a>
        </div>
      `;
      document.getElementById("modalOverlay").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.add("hidden");
    }

    document.getElementById("modalOverlay").addEventListener("click", e => {
      if (e.target === document.getElementById("modalOverlay")) closeModal();
    });

    document.getElementById("searchInput").addEventListener("input", render);
    setupTabs();
    render();
  </script>
</body>
</html>
